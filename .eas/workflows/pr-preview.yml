# Publicerar varje PR som en egen uppdatering på en egen branch, och lägger
# en kommentar med QR-kod på PR:en. Den hamnar INTE på kanalen "preview",
# så ingen får koden förrän du har godkänt och mergat.
#
# QR-koden öppnas i development-builden "Skaffa (dev)" (expo-dev-client),
# inte i preview-appen. Därför publiceras uppdateringen med
# APP_VARIANT=development: varianten ingår i fingerprinten, och den måste
# stämma med dev-builden för att den ska acceptera uppdateringen.
#
# Ändrar PR:en native-koden passar den inte i den installerade dev-builden;
# då testar du efter merge när en ny APK byggts.
name: PR preview

on:
  pull_request:
    branches: ["main"]

jobs:
  publish_preview:
    name: Publicera PR-uppdatering
    type: update
    environment: preview
    env:
      APP_VARIANT: development
    params:
      platform: android
      branch: pr-${{ github.event.pull_request.number }}

  comment:
    name: Kommentera PR:en
    needs: [publish_preview]
    type: github-comment
