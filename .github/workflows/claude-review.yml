# Review-agenten. Granskar varje PR mot main och lämnar kommentarer.
# Den godkänner aldrig själv — det gör du.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Hoppa över utkast och release-please:s release-PR (bara version + CHANGELOG).
    if: |
      !github.event.pull_request.draft &&
      !startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Granska den här PR:en i Skaffa. PR-branchen är redan utcheckad.
            Läs CLAUDE.md först. Skriv på svenska.

            Fokusera på riktiga fel, inte stil:
            - Buggar och kantfall i den ändrade koden.
            - Navigation: skärmar ska inte navigera själva efter mutationer som
              guarden i src/app/_layout.tsx hanterar (ingen router.replace efter
              skapa/gå med/lämna hem).
            - Auth: onAuthStateChange-callbacken måste vara synkron.
            - Databasen: invarianter i Postgres (ett hem per användare, medlemskap
              bara via RPC). Ändras unit_to_base() i SQL måste src/lib/units.ts
              följa med, och tvärtom.
            - Query-nycklar: privat data per konto ska ha användar-id i nyckeln.
            - Ändrar PR:en native-kod (nya native-paket, plugins i app.json)?
              Säg i så fall att den kräver en ny APK och inte går ut som OTA.
            - Löser PR:en faktiskt issuet den refererar till?

            Använd `gh pr comment` för en sammanfattning och
            `mcp__github_inline_comment__create_inline_comment` (med `confirmed: true`)
            för konkreta problem på specifika rader. Hittar du inget allvarligt,
            säg det kort. Posta bara GitHub-kommentarer.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
